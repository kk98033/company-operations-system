[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-system-backend"
version = "0.1.0"
description = "Internal company management system API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18.5,<1.19",
    "argon2-cffi>=25.1,<26.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "psycopg[binary]>=3.3.4,<3.4",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.9.1",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "database_integration: requires the isolated PostgreSQL test service",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["UP046", "UP047"]
